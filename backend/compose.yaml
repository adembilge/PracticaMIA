# Local development database only. Not intended for public deployment.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: practicamia
      POSTGRES_USER: practicamia
      POSTGRES_PASSWORD: local_development_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practicamia -d practicamia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
