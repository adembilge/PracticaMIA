[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "practicamia-backend"
version = "0.2.0"
description = "Development-only authenticated case persistence API for PracticaMIA"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "SQLAlchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "PyJWT[crypto]>=2.13,<3",
    "httpx>=0.27,<1",
    "pypdf>=5.9,<7",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    "python-multipart>=0.0.20,<1",
    "cryptography>=44,<47",
    "Pillow>=11,<13",
    "pytesseract>=0.3.13,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "reportlab>=4,<5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.knowledge" = ["candidate_sources.json"]
"app.rules" = ["catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
