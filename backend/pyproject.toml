[project]
name = "practica-mia"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "trafilatura>=2.0",
  "pypdf>=5.0",
  "pyyaml>=6.0",
  "langgraph>=0.2",
  "langchain-groq>=0.2",
  "langchain-core>=0.3",
  "fastembed>=0.4",
  "supabase>=2.10",
  "pyjwt[crypto]>=2.10",
  "langdetect>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: needs Supabase, Groq, or a model download"]

[tool.setuptools.packages.find]
include = ["app*", "ingest*"]
