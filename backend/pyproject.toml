[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "practicamia-backend"
version = "0.2.0"
description = "Development-only authenticated case persistence API for PracticaMIA"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "SQLAlchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "PyJWT[crypto]>=2.13,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.knowledge" = ["candidate_sources.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
