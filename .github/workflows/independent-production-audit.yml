name: Independent read-only production smoke audit

on:
  push:
    branches: [audit/independent-system-regressions]
    paths:
      - "audit/live_production_smoke.py"
      - ".github/workflows/independent-production-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-live-smoke:
    name: Anonymous GET security and deployment drift checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Single anonymous GET per diagnostic route
        run: python audit/live_production_smoke.py
      - name: Preserve result metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: independent-production-audit-${{ github.run_id }}
          path: audit/results/
          if-no-files-found: warn
          retention-days: 14
