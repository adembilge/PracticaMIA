name: Backend integration acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: Backend integration with disposable PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: practicamia_acceptance
          POSTGRES_USER: practicamia
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U practicamia -d practicamia_acceptance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://practicamia:ci_only@127.0.0.1:5432/practicamia_acceptance
      PRACTICAMIA_ACCEPTANCE_DATABASE_URL: postgresql+psycopg://practicamia:ci_only@127.0.0.1:5432/practicamia_acceptance
      PRACTICAMIA_E2E_LOCAL_ONLY: "1"
      ENABLE_PRIVATE_DOCUMENT_API: "0"
      ENABLE_ASSISTANT_API: "0"
      ENABLE_PREPARATION_API: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Migrate disposable PostgreSQL
        working-directory: backend
        run: python -m alembic -c alembic.ini upgrade head
      - name: Run database-backed workflow and document safeguards
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_case_workflow.py
          tests/test_case_package.py
          tests/test_private_document_intelligence.py
          tests/test_case_checklist.py
      - name: Rehearse logical backup and restore without production data
        shell: bash
        run: |
          set -euo pipefail
          postgres_container="${{ job.services.postgres.id }}"
          docker exec "$postgres_container" psql -v ON_ERROR_STOP=1 -U practicamia -d practicamia_acceptance -c "
            INSERT INTO cases (id, owner_subject, procedure, status, scope_answers, created_at, updated_at, archived_at)
            VALUES ('00000000-0000-4000-8000-000000000017', 'synthetic-backup-drill',
              'milan_residence_change', 'draft', '[]', now(), now(), now());
            INSERT INTO private_case_documents
              (id, case_id, owner_subject, category, media_type, content_sha256,
               ciphertext, review_ciphertext, consent_version, consented_at, scanned_at, uploaded_at, expires_at)
            VALUES ('00000000-0000-4000-8000-000000000018', '00000000-0000-4000-8000-000000000017',
              'synthetic-backup-drill', 'housing_document', 'application/pdf', repeat('0', 64),
              decode('aabb','hex'), decode('ccdd','hex'), 'synthetic-drill', now(), now(), now(), now() - interval '1 day');"
          trap 'rm -f "$RUNNER_TEMP/practicamia-restore.dump"' EXIT
          docker exec "$postgres_container" pg_dump -U practicamia -Fc practicamia_acceptance > "$RUNNER_TEMP/practicamia-restore.dump"
          docker exec "$postgres_container" createdb -U practicamia practicamia_restore
          docker exec -i "$postgres_container" pg_restore --exit-on-error -U practicamia -d practicamia_restore < "$RUNNER_TEMP/practicamia-restore.dump"
          result="$(docker exec "$postgres_container" psql -v ON_ERROR_STOP=1 -U practicamia -d practicamia_restore -Atc "
            SELECT version_num,
              (SELECT count(*) FROM cases WHERE owner_subject = 'synthetic-backup-drill' AND archived_at IS NOT NULL),
              (SELECT count(*) FROM private_case_documents WHERE owner_subject = 'synthetic-backup-drill'
                AND ciphertext = decode('aabb','hex') AND review_ciphertext = decode('ccdd','hex') AND expires_at < now())
            FROM alembic_version;")"
          test "$result" = '20261119_0024|1|1'
          docker exec "$postgres_container" psql -v ON_ERROR_STOP=1 -U practicamia -d practicamia_acceptance -c "
            DELETE FROM cases WHERE owner_subject = 'synthetic-backup-drill';"
          echo "Disposable restore preserved schema, archived internal task and encrypted payload bytes."
