name: Product governance

on:
  pull_request:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "README.md"
      - "docs/**"
      - "frontend/src/app/page.tsx"
      - "frontend/src/app/api/**"
      - "frontend/src/components/**"
      - "scripts/tests/**"
      - ".github/workflows/product-governance.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "README.md"
      - "docs/**"
      - "frontend/src/app/page.tsx"
      - "frontend/src/app/api/**"
      - "frontend/src/components/**"
      - "scripts/tests/**"
      - ".github/workflows/product-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # Keep the required GitHub check context stable while validating the current product contract.
    name: Validate 94-task governance and negative controls
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify the product surface and phase boundary
        run: python -m unittest discover -s scripts/tests -v
