name: Generate npm lockfile

on:
  push:
    branches: [chore/reproducible-installs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Generate lockfile from npm registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate lockfile resolution
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock frontend npm dependencies"
            git push origin HEAD:chore/reproducible-installs
          fi
      - name: Upload lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-package-lock
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 1
