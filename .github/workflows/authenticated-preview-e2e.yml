name: Authenticated preview isolation (opt-in)

on:
  pull_request:
    branches: [main]
    paths:
      - "audit/authenticated_preview_e2e.py"
      - "audit/tests/test_authenticated_preview_e2e.py"
      - ".github/workflows/authenticated-preview-e2e.yml"
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Exact isolated FRONTEND deployment URL (not production)"
        type: string
        required: true
      synthetic_only:
        description: "I confirm this is an isolated preview with synthetic cases only"
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  offline-guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify preview target and credential safety contracts offline
        run: python -m unittest discover -s audit/tests -v

  authenticated-browser:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.synthetic_only == true }}
    needs: offline-guardrails
    runs-on: ubuntu-latest
    environment: preview-e2e
    timeout-minutes: 10
    env:
      E2E_PREVIEW_BASE_URL: ${{ inputs.preview_url }}
      E2E_ALLOWED_PREVIEW_HOST: ${{ vars.PRACTICAMIA_E2E_ALLOWED_PREVIEW_HOST }}
      E2E_AUTH0_HOST: ${{ vars.PRACTICAMIA_E2E_AUTH0_HOST }}
      E2E_A_EMAIL: ${{ secrets.PRACTICAMIA_E2E_A_EMAIL }}
      E2E_A_PASSWORD: ${{ secrets.PRACTICAMIA_E2E_A_PASSWORD }}
      E2E_B_EMAIL: ${{ secrets.PRACTICAMIA_E2E_B_EMAIL }}
      E2E_B_PASSWORD: ${{ secrets.PRACTICAMIA_E2E_B_PASSWORD }}
      E2E_ACK_SYNTHETIC_ONLY: "YES"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install isolated browser runner
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Real two-account journey against exact approved preview only
        run: python audit/authenticated_preview_e2e.py
      - name: Preserve redacted status-only audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: authenticated-preview-e2e-${{ github.run_id }}
          path: audit/results/authenticated_preview_e2e.json
          if-no-files-found: warn
          retention-days: 7
