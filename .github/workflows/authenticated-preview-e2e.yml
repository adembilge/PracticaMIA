name: Preview target safety guardrails

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/guardrails/**"
      - ".github/workflows/authenticated-preview-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify Preview target and synthetic identity contracts offline
        run: python -m unittest discover -s scripts/guardrails -v
