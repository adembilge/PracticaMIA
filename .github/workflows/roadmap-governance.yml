name: Roadmap governance CI

on:
  pull_request:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "docs/MASTER_PLAN.md"
      - "docs/TASKS.yaml"
      - "docs/PROGRESS.md"
      - "docs/DECISIONS.md"
      - "PracticaMIA_Complete_Project_Specification.md"
      - "scripts/validate_roadmap.py"
      - "scripts/tests/**"
      - ".github/workflows/roadmap-governance.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "docs/MASTER_PLAN.md"
      - "docs/TASKS.yaml"
      - "PracticaMIA_Complete_Project_Specification.md"
      - "scripts/validate_roadmap.py"
      - "scripts/tests/**"
      - ".github/workflows/roadmap-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate 94-task governance and negative controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned standalone parser
        run: python -m pip install PyYAML==6.0.2
      - name: Check canonical roadmap and evidence gates
        run: python scripts/validate_roadmap.py
      - name: Check expected governance rejection cases
        run: python -m unittest discover -s scripts/tests -v
