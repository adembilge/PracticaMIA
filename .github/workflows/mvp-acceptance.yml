name: Synthetic MVP Acceptance (Chromium + API)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvp-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-acceptance:
    name: Browser + signed JWT + real FastAPI + disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: practicamia_acceptance
          POSTGRES_USER: practicamia
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U practicamia -d practicamia_acceptance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://practicamia:ci_only@127.0.0.1:5432/practicamia_acceptance
      PRACTICAMIA_ACCEPTANCE_DATABASE_URL: postgresql+psycopg://practicamia:ci_only@127.0.0.1:5432/practicamia_acceptance
      PRACTICAMIA_ACCEPTANCE_ORIGIN: http://127.0.0.1:8765
      PRACTICAMIA_E2E_LOCAL_ONLY: "1"
      ENABLE_PRIVATE_DOCUMENT_API: "0"
      ENABLE_ASSISTANT_API: "0"
      ENABLE_PREPARATION_API: "0"
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install backend and test dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"

      - name: Migrate isolated PostgreSQL (never Neon production)
        working-directory: backend
        run: python -m alembic -c alembic.ini upgrade head

      - name: Run multi-route API and synthetic document acceptance contracts
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_case_workflow.py
          tests/test_case_package.py
          tests/test_private_document_intelligence.py
          tests/test_case_checklist.py

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install project frontend and pinned CI-only browser tools
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --no-audit --no-fund \
            esbuild@0.25.12 playwright@1.56.0

      - name: Install headless Chromium on GitHub runner
        working-directory: frontend
        run: npx --no-install playwright install chromium --with-deps

      - name: Compile the real React components into a CI-only browser mount
        working-directory: frontend
        run: |
          mkdir -p .acceptance-dist .acceptance-results
          npx --no-install esbuild tests/acceptance/browser-entry.tsx \
            --bundle --platform=browser --format=iife --jsx=automatic --target=es2022 \
            --tsconfig=tsconfig.json \
            --alias:next/link=./tests/acceptance/next-link.tsx \
            --alias:next/navigation=./tests/acceptance/next-navigation.ts \
            --outfile=.acceptance-dist/acceptance.js
          cp tests/acceptance/index.html .acceptance-dist/index.html

      - name: Run local two-account browser-to-FastAPI acceptance suite
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && python tests/acceptance/local_server.py \
            --port 8765 --assets ../frontend/.acceptance-dist) \
            > frontend/.acceptance-results/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 80); do
            if curl --fail --silent http://127.0.0.1:8765/__acceptance/health > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 0.4
          done
          if [ "$ready" != "1" ]; then
            cat frontend/.acceptance-results/server.log
            exit 1
          fi
          (cd frontend && node tests/acceptance/run.mjs)

      - name: Save synthetic acceptance report and failure screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-mvp-acceptance
          path: frontend/.acceptance-results/
          if-no-files-found: warn
          retention-days: 14
