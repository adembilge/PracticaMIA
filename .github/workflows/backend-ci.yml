name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Backend tests and PostgreSQL migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: practicamia_test
          POSTGRES_USER: practicamia
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U practicamia -d practicamia_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://practicamia:ci_only@127.0.0.1:5432/practicamia_test
      ENABLE_DEMO_CASE_API: "0"
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run API and domain tests
        run: python -m pytest -q
      - name: Upgrade PostgreSQL schema
        run: python -m alembic -c alembic.ini upgrade head
      - name: PostgreSQL persistence smoke test
        run: |
          python - <<'PY'
          import os
          from fastapi.testclient import TestClient
          from app.config import Settings
          from app.main import create_app
          api = create_app(Settings(database_url=os.environ["DATABASE_URL"], enable_demo_case_api=True))
          with TestClient(api) as client:
              created = client.post("/api/v1/cases", json={})
              assert created.status_code == 201, created.text
              case_id = created.json()["id"]
              updated = client.patch(f"/api/v1/cases/{case_id}/scope", json={"answers": ["yes", "yes", "yes", "no", "yes"]})
              assert updated.status_code == 200, updated.text
              assert updated.json()["status"] == "provisionally_in_scope"
              assert client.get(f"/api/v1/cases/{case_id}").status_code == 200
              assert client.delete(f"/api/v1/cases/{case_id}").status_code == 204
          PY
