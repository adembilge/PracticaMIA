name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Backend tests and PostgreSQL migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: practicamia_test
          POSTGRES_USER: practicamia
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U practicamia -d practicamia_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://practicamia:ci_only@127.0.0.1:5432/practicamia_test
      ENABLE_DEMO_CASE_API: "0"
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run API and authentication tests
        run: python -m pytest -q
      - name: Create legacy PostgreSQL schema and seed anonymous case
        run: |
          python -m alembic -c alembic.ini upgrade 20261104_0001
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.begin() as conn:
              conn.execute(text("""
                  INSERT INTO cases
                    (id, procedure, status, scope_answers, created_at, updated_at)
                  VALUES
                    ('00000000-0000-0000-0000-000000000001',
                     'milan_residence_change', 'draft', '[]',
                     CURRENT_TIMESTAMP, CURRENT_TIMESTAMP)
              """))
          engine.dispose()
          PY
      - name: Upgrade PostgreSQL to owner-scoped schema
        run: python -m alembic -c alembic.ini upgrade head
      - name: Verify PostgreSQL ownership, knowledge migrations and indexed lexical retrieval
        env:
          RUN_POSTGRES_SMOKE: "1"
        run: python -m pytest -q tests/test_postgres_smoke.py tests/test_postgres_knowledge_smoke.py tests/test_postgres_retrieval_eval.py tests/test_postgres_search_smoke.py tests/test_postgres_vector_smoke.py
