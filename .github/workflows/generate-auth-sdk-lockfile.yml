name: Generate Auth0 SDK dependency lockfile

on:
  push:
    branches: [feature/auth0-login-bff]
    paths:
      - ".github/workflows/generate-auth-sdk-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Add Auth0 SDK and update npm lockfile
        run: npm install @auth0/nextjs-auth0@4.33.0 --save-exact --no-audit --no-fund
      - name: Verify locked dependency installation
        run: npm ci --no-audit --no-fund
      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: add pinned Auth0 Next.js SDK dependency"
            git push origin HEAD:feature/auth0-login-bff
          fi
