name: Official municipal HTML original-byte audit

on:
  push:
    branches: [feature/official-html-acquisition-audit]
    paths:
      - ".github/workflows/official-html-audit.yml"
      - "backend/app/knowledge/audit_web_sources.py"
      - "backend/app/knowledge/acquisition.py"
      - "backend/app/knowledge/candidate_sources.json"
      - "backend/tests/test_official_html_audit.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-source-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Try 14 original official HTML requests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install acquisition code
        run: python -m pip install --disable-pip-version-check --quiet -e ./backend
      - name: Capture original HTML with no redirects or retries
        working-directory: backend
        run: python -m app.knowledge.audit_web_sources --output-dir "${{ runner.temp }}/official-audit"
      - name: Preserve original bytes and manifest for human review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: official-html-originals-${{ github.run_id }}
          path: ${{ runner.temp }}/official-audit/
          if-no-files-found: warn
          retention-days: 7
