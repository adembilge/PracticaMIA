name: paperpilot

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ${PAPERPILOT_POSTGRES_CONTAINER:-paperpilot-postgres}
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
      POSTGRES_DB: paperpilot
    ports:
      - "127.0.0.1:${PAPERPILOT_DB_PORT:-5432}:5432"
    volumes:
      - ${PAPERPILOT_PGDATA:-paperpilot-pgdata}:/var/lib/postgresql/data
      - ./database/init/01-vector.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paperpilot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build: ./backend
    container_name: ${PAPERPILOT_API_CONTAINER:-paperpilot-api}
    environment:
      PAPERPILOT_DB_HOST: postgres
      PAPERPILOT_DB_PORT: "5432"
    ports:
      - "127.0.0.1:${PAPERPILOT_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  paperpilot-pgdata:
  paperpilot-staging-pgdata:
  paperpilot-production-pgdata:
